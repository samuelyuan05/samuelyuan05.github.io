<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View My Resume</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .resume-container {
            width: 100%;
            max-width: 800px; /* Standard resume reading width */
            height: 900px;    /* Height of the viewport */
            border: 1px solid #ccc;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <h1>My Resume</h1>
    
    <!-- Direct Viewport Container -->
    <div class="resume-container">
        <embed src="Samuel_Yuan_Resume.pdf" type="application/pdf" width="100%" height="600px" />    
    </div>

</body>
</html>
